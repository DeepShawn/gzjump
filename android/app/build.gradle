plugins { id 'com.android.application' }

android {
    namespace 'com.deepshawn.gzjump'
    compileSdk 35
    defaultConfig { applicationId 'com.deepshawn.gzjump'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
    signingConfigs { release { if (project.hasProperty('RELEASE_STORE_FILE')) { storeFile file(project.property('RELEASE_STORE_FILE')); storePassword project.property('RELEASE_STORE_PASSWORD'); keyAlias project.property('RELEASE_KEY_ALIAS'); keyPassword project.property('RELEASE_KEY_PASSWORD') } } }
    buildTypes { release { minifyEnabled false; shrinkResources false; if (project.hasProperty('RELEASE_STORE_FILE')) signingConfig signingConfigs.release } }
}
