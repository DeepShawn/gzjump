name: Publish Android APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.2.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "GZJump Android $TAG" --notes "Android WebView release with Supabase authentication and score moderation."
          gh release upload "$TAG" android/gzjump-webview-release.apk --clobber
